spring.application.name=figuras-spring

# --- Extra: servicio externo de figuras ---
# URL del catalogo JSON con las figuras Groovy. Por defecto la propia app
# sirve un catalogo de ejemplo en /catalogo/figuras.json. Para usar un
# servicio externo real, apunta a otra URL (por ejemplo un raw de GitHub).
figuras.remoto.catalogo-url=https://raw.githubusercontent.com/mateo-cuascota/figuras-catalogo/main/figuras.json
# true = importa al arrancar; false = solo con el boton Importar (POST /api/figuras/importar)
figuras.remoto.cargar-al-iniciar=false
